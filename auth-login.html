<body>
  <div class="fauth">
    <main class="fauth-main">
      <div class="fauth-main-inner">
        <a href="index.html" class="fauth-logo fauth-logo-center">
          <img src="assets/img/logo.webp" alt="NiceAdmin">
          <span>Ordena</span>
        </a>

        <div class="fauth-card">
          <div class="fauth-card-head">
            <span class="fauth-kicker"><i class="bi bi-shield-check"></i> Acesso Seguro</span>
            <h1 class="fauth-title">Bem-vindo ao Ordena</h1>
            <p class="fauth-subtitle">Entre com suas credenciais para acessar o sistema.</p>
          </div>

          <form class="fauth-form" novalidate>
            <div class="fauth-field">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="fauth-field">
              <div class="fauth-row-between">
                <label for="password" class="form-label">Senha</label>
                <a href="auth-forgot-password.html" class="fauth-link">Esqueceu sua senha?</a>
              </div>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                <button class="btn btn-outline-secondary" type="button" data-toggle-password>
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- <div class="fauth-row-between mb-3">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="auth-lock-screen.html" class="fauth-link">Use lock screen</a>
            </div> -->

            <button type="submit" class="btn btn-primary w-100">Entrar</button>

            <div class="fauth-divider"><span>Não possui acesso? </span></div>

            <!-- <div class="fauth-social">
              <button type="button" class="btn btn-outline-secondary"><i class="bi bi-google"></i> Google</button>
              <button type="button" class="btn btn-outline-secondary"><i class="bi bi-github"></i> GitHub</button>
            </div> -->
          </form>

          <p class="fauth-foot-text">Solicite ao administrador. <a href="auth-register.html" class="fauth-link">Crie uma conta</a></p>
        </div>

        <footer class="footer-centered">
          <div class="footer-copyright">&copy; 2026 <a href="#">Ordena</a>. Todos os direitos reservados..</div>
          <div class="footer-links"><a href="#">Política de Privacidad</a><a href="#">Termos de Uso</a><a href="#">Suporte</a></div>
        </footer>
      </div>
    </main>
  </div>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/apexcharts/apexcharts.min.js"></script>
  <script src="assets/vendor/chart.js/chart.umd.js"></script>

  <script src="assets/vendor/simple-datatables/simple-datatables.js"></script>
  <script src="assets/vendor/quill/quill.js"></script>
  <script src="assets/vendor/tinymce/tinymce.min.js"></script>

  <!-- Template Main JS Files -->

  <script src="assets/js/main.js"></script>

  <!-- App Sidebar Toggle (for app pages with sidebars) -->

</body>

</html>
